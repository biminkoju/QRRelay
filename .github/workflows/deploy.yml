name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - run: npm run build
      - name: Verify the Pages build is self-contained
        run: |
          set -eu
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/manifest.json
          test -f dist/.nojekyll
          if grep -E '(src|href)="/[^/]' dist/index.html; then
            echo "dist/index.html contains a root-absolute asset path" >&2
            exit 1
          fi
          echo "Pages build looks correct"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
